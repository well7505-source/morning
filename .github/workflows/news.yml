name: 뉴스 갱신

on:
  schedule:
    - cron: "*/20 * * * *"   # 20분마다
  workflow_dispatch:          # 손으로도 돌릴 수 있게
  push:
    paths:
      - build-news.mjs
      - .github/workflows/news.yml

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node build-news.mjs
      - name: 바뀌었으면 커밋
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "뉴스 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "변경 없음"
          fi
