<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침 정거장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F9FAFB">
<meta name="description" content="오늘의 날씨와 경제 뉴스로 하루를 여는 시작 페이지">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아침 정거장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#F9FAFB;
  --card:#FFFFFF;
  --line:#EDF0F3;
  --line-soft:#F4F6F8;
  --ink:#232A31;
  --ink-2:#4A5560;
  --muted:#78828D;
  --faint:#A6AEB8;
  --sun:#C98F4F;
  --sun-soft:#FAF3EA;
  --down:#5B87B8;
  --link:#3F6F9E;
  --shadow:0 1px 3px rgba(35,42,49,.03), 0 10px 28px rgba(35,42,49,.05);
  --radius:18px;

  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-body:"IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px;padding-block:28px 56px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--sun);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);font-weight:600;
}

/* ---------- 헤더: 시계 + 검색 ---------- */
.top{
  display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;
  justify-content:space-between;margin-bottom:22px;
}
.clock-block{min-width:250px}
.greet{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--ink-2);margin:0 0 2px}
.clock{
  font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  font-size:clamp(44px,7vw,62px);font-weight:500;line-height:1;
  letter-spacing:-.02em;margin:0;
}
.clock .sec{font-size:.45em;color:var(--sun);font-weight:500;margin-left:.16em;vertical-align:.12em}
.datebar{margin-top:8px;color:var(--muted);font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datebar .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);flex:none}

.search{flex:1 1 380px;max-width:560px}
.engines{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.engine{
  font:inherit;font-size:12.5px;font-weight:500;
  border:1px solid transparent;background:none;color:var(--muted);
  padding:4px 11px;border-radius:999px;cursor:pointer;transition:.15s;
}
.engine:hover{color:var(--ink)}
.engine[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.searchbar{
  display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid transparent;border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);
  transition:border-color .2s, box-shadow .2s;
}
.searchbar:focus-within{border-color:#E7DCCC;box-shadow:0 0 0 4px var(--sun-soft)}
.searchbar svg{flex:none;color:var(--faint)}
.searchbar input{
  flex:1;border:0;background:none;font:inherit;font-size:15.5px;color:var(--ink);min-width:0;
}
.searchbar input:focus{outline:none}
.searchbar input::placeholder{color:var(--faint)}
.go{
  font:inherit;font-size:12.5px;font-weight:600;border:0;cursor:pointer;
  background:var(--ink);color:#fff;padding:7px 14px;border-radius:8px;
}
.go:hover{background:#000}

/* ---------- 하루 띠 ---------- */
.dayband{
  position:relative;height:60px;border-radius:var(--radius);overflow:hidden;
  margin-bottom:18px;background:#DCE6F0;box-shadow:var(--shadow);
}
.dayband canvas{display:block;width:100%;height:100%}
.dayband .marks{
  position:absolute;inset:0;pointer-events:none;
  font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.dayband .mark{position:absolute;bottom:7px;transform:translateX(-50%);white-space:nowrap}
.dayband .mark.edge-l{transform:none;left:12px}
.dayband .mark.edge-r{transform:none;right:12px}
.dayband .nowdot{
  position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.95);
  box-shadow:0 0 10px rgba(255,255,255,.9);
}
.dayband .sun-glyph{
  position:absolute;width:18px;height:18px;border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 16px 4px rgba(255,220,150,.75);
}

/* ---------- 카드 공통 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:18px 22px 10px;
}
.card-head h2{
  font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;
}
.stamp{font-family:var(--f-mono);font-size:11px;color:var(--faint)}

/* ---------- 날씨 ---------- */
.wx{display:grid;grid-template-columns:minmax(230px,.9fr) 1.55fr;margin-bottom:20px}
.wx-now{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.wx-city{display:flex;align-items:center;gap:8px}
.wx-city select{
  font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);
  border:0;background:var(--line-soft);border-radius:9px;padding:5px 9px;cursor:pointer;
}
.wx-read{display:flex;align-items:center;gap:14px}
.wx-temp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:54px;font-weight:500;line-height:.95;letter-spacing:-.03em}
.wx-temp .deg{font-size:.42em;color:var(--muted);vertical-align:.7em;margin-left:.06em}
.wx-desc{font-size:14.5px;font-weight:600;color:var(--ink-2)}
.wx-feels{font-size:12.5px;color:var(--muted);margin-top:1px}
.wx-icon{flex:none;color:var(--sun);line-height:0}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;background:var(--line-soft);
  border-radius:13px;padding:13px 15px;margin:0}
.gauge{padding:5px 0}
.gauge dt{font-size:10.5px;letter-spacing:.08em;color:var(--faint);font-weight:600;text-transform:uppercase}
.gauge dd{margin:2px 0 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500}
.gauge dd small{font-size:11px;color:var(--muted);font-family:var(--f-body);margin-left:2px}
.uv-pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:5px;vertical-align:2px;font-family:var(--f-body)}

.wx-right{padding:20px 24px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.hourly{overflow-x:auto}
.hourly svg{display:block}
.days{display:grid;gap:2px}
.day{
  display:grid;grid-template-columns:58px 22px 40px 1fr 34px;
  align-items:center;gap:10px;padding:6px 0;
}
.day .dname{font-size:13px;font-weight:500;color:var(--ink-2)}
.day .dname.today{color:var(--sun)}
.day .dpop{font-family:var(--f-mono);font-size:11px;color:var(--down);text-align:right}
.day .dhi{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;text-align:right}
.range{height:6px;border-radius:999px;background:var(--line-soft);position:relative;overflow:hidden}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#AFCBE6,#D9AE7C)}

/* ---------- 뉴스 ---------- */
.news-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-bottom:20px;align-items:start}
.feed{list-style:none;margin:0;padding:2px 10px 14px}
.feed a{display:block;padding:11px 12px;border-radius:12px;transition:background .18s}
.feed a:hover{background:var(--line-soft)}
.feed .headline{font-size:14.5px;font-weight:400;line-height:1.5;color:var(--ink);letter-spacing:-.005em}
.feed a:hover .headline{color:var(--link)}
.feed .meta{margin-top:4px;font-size:11.5px;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feed .src{font-weight:500;color:var(--muted)}
.feed .when{font-family:var(--f-mono)}
.feed .rank{font-family:var(--f-mono);font-size:11px;color:var(--faint);font-weight:500;margin-right:8px}
.lead .headline{font-size:16px;font-weight:500;line-height:1.42}
.lead .rank{color:var(--sun)}
.state{padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
.state button{
  font:inherit;font-size:12.5px;font-weight:600;margin-top:10px;cursor:pointer;
  border:0;background:var(--line-soft);border-radius:10px;padding:7px 14px;color:var(--ink);
}
.state button:hover{background:var(--sun-soft);color:var(--sun)}
.skel{padding:11px 12px}
.skel span{display:block;height:11px;border-radius:6px;background:linear-gradient(90deg,#F1F4F7,#F9FBFC,#F1F4F7);background-size:200% 100%;animation:sh 1.4s linear infinite}
.skel span + span{margin-top:7px;width:58%}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- 링크 ---------- */
.foot{margin-top:24px;text-align:center;color:var(--faint);font-size:12px}
.foot .num{color:var(--muted)}

@media (max-width:880px){
  .wx{grid-template-columns:1fr}
  .wx-now{border-right:0;border-bottom:1px solid var(--line-soft)}
  .news-grid{grid-template-columns:1fr}
}
@media (max-width:520px){
  .wrap{padding-block:20px 40px}
  .clock{font-size:clamp(38px,13vw,52px)}
  .day{grid-template-columns:52px 20px 34px 1fr 32px;gap:7px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="clock-block">
      <p class="greet" id="greet">좋은 아침입니다</p>
      <p class="clock"><span id="hm">--:--</span><span class="sec" id="ss">00</span></p>
      <div class="datebar">
        <span id="today">—</span>
        <span class="dot"></span>
        <span id="weekcount">—</span>
      </div>
    </div>

    <form class="search" id="searchForm" role="search">
      <div class="engines" id="engines">
        <button type="button" class="engine" data-engine="google" aria-pressed="true">Google</button>
        <button type="button" class="engine" data-engine="naver" aria-pressed="false">네이버</button>
        <button type="button" class="engine" data-engine="daum" aria-pressed="false">다음</button>
        <button type="button" class="engine" data-engine="youtube" aria-pressed="false">유튜브</button>
      </div>
      <div class="searchbar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
        <input id="q" type="search" placeholder="검색어를 입력하세요" autocomplete="off" aria-label="검색어">
        <button class="go" type="submit">검색</button>
      </div>
    </form>
  </header>

  <div class="dayband" id="dayband" aria-label="오늘 하루의 해 위치">
    <canvas id="skycanvas" width="1200" height="112"></canvas>
    <div class="marks" id="daymarks"></div>
  </div>

  <section class="card wx" aria-label="날씨">
    <div class="wx-now">
      <div class="wx-city">
        <span class="eyebrow">지금</span>
        <select id="city" aria-label="도시 선택"></select>
      </div>
      <div class="wx-read">
        <div class="wx-icon" id="wxIcon"></div>
        <div class="wx-temp"><span id="temp">--</span><span class="deg">°C</span></div>
      </div>
      <div>
        <div class="wx-desc" id="wxDesc">불러오는 중</div>
        <div class="wx-feels" id="wxFeels">체감 기온을 확인하고 있습니다</div>
      </div>
      <dl class="gauges">
        <div class="gauge"><dt>습도</dt><dd id="gHum">--<small>%</small></dd></div>
        <div class="gauge"><dt>바람</dt><dd id="gWind">--<small>m/s</small></dd></div>
        <div class="gauge"><dt>강수</dt><dd id="gRain">--<small>mm</small></dd></div>
        <div class="gauge"><dt>자외선</dt><dd id="gUv">--</dd></div>
      </dl>
    </div>
    <div class="wx-right">
      <div>
        <div class="eyebrow" style="margin-bottom:6px" id="hourlyLabel">시간별</div>
        <div class="hourly" id="hourly"></div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:4px">주간</div>
        <div class="days" id="days"></div>
      </div>
    </div>
  </section>

  <div class="news-grid">
    <section class="card" aria-label="경제 뉴스">
      <div class="card-head">
        <h2>경제</h2>
        <span class="stamp" id="ecoStamp">불러오는 중</span>
      </div>
      <ul class="feed" id="ecoFeed">
        <li class="skel"><span></span><span></span></li>
        <li class="skel"><span></span><span></span></li>
        <li class="skel"><span></span><span></span></li>
        <li class="skel"><span></span><span></span></li>
      </ul>
    </section>

    <section class="card" aria-label="종합 헤드라인">
      <div class="card-head">
        <h2>종합 헤드라인</h2>
        <span class="stamp" id="topStamp">불러오는 중</span>
      </div>
      <ul class="feed" id="topFeed">
        <li class="skel"><span></span><span></span></li>
        <li class="skel"><span></span><span></span></li>
        <li class="skel"><span></span><span></span></li>
      </ul>
    </section>
  </div>

  <p class="foot">날씨 Open-Meteo · 뉴스 한국경제 · 연합뉴스 RSS · 마지막 갱신 <span class="num" id="lastSync">—</span></p>
</div>

<script>
(function(){
"use strict";

/* ===================== 기본 데이터 ===================== */
var CITIES = [
  {name:"서울", lat:37.5665, lon:126.9780},
  {name:"인천", lat:37.4563, lon:126.7052},
  {name:"수원", lat:37.2636, lon:127.0286},
  {name:"춘천", lat:37.8813, lon:127.7300},
  {name:"강릉", lat:37.7519, lon:128.8761},
  {name:"대전", lat:36.3504, lon:127.3845},
  {name:"전주", lat:35.8242, lon:127.1480},
  {name:"대구", lat:35.8714, lon:128.6014},
  {name:"광주", lat:35.1595, lon:126.8526},
  {name:"울산", lat:35.5384, lon:129.3114},
  {name:"부산", lat:35.1796, lon:129.0756},
  {name:"제주", lat:33.4996, lon:126.5312}
];

var WMO = {
  0:["맑음","clear"], 1:["대체로 맑음","clear"], 2:["구름 조금","partly"], 3:["흐림","cloud"],
  45:["안개","fog"], 48:["상고대 안개","fog"],
  51:["약한 이슬비","drizzle"], 53:["이슬비","drizzle"], 55:["짙은 이슬비","drizzle"],
  56:["어는 이슬비","drizzle"], 57:["짙은 어는 이슬비","drizzle"],
  61:["약한 비","rain"], 63:["비","rain"], 65:["강한 비","rain"],
  66:["어는 비","rain"], 67:["강한 어는 비","rain"],
  71:["약한 눈","snow"], 73:["눈","snow"], 75:["많은 눈","snow"], 77:["싸락눈","snow"],
  80:["소나기","rain"], 81:["소나기","rain"], 82:["강한 소나기","rain"],
  85:["소낙눈","snow"], 86:["강한 소낙눈","snow"],
  95:["뇌우","storm"], 96:["우박 동반 뇌우","storm"], 99:["강한 우박 뇌우","storm"]
};
function wmoText(c){ return (WMO[c] || ["알 수 없음","cloud"])[0]; }
function wmoKind(c){ return (WMO[c] || ["","cloud"])[1]; }

function icon(kind, size){
  var s = size || 46;
  var open = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var sun = '<circle cx="24" cy="24" r="8.5" fill="#F7E6C8" stroke="currentColor"></circle>' +
            '<path d="M24 6v4M24 38v4M6 24h4M38 24h4M11.2 11.2l2.9 2.9M33.9 33.9l2.9 2.9M36.8 11.2l-2.9 2.9M14.1 33.9l-2.9 2.9"></path>';
  var cloud = '<path d="M15 35h17a7.5 7.5 0 0 0 .6-15 10.5 10.5 0 0 0-20 2.2A6.4 6.4 0 0 0 15 35z" fill="#F3F6F9" stroke="#AAB8C6"></path>';
  if(kind === "clear")   return open + sun + '</svg>';
  if(kind === "partly")  return open + '<circle cx="18" cy="16" r="6" fill="#F7E6C8" stroke="currentColor"></circle><path d="M18 4v3M7 16h3M10.2 8.2l2.1 2.1M25.8 8.2l-2.1 2.1"></path>' + cloud + '</svg>';
  if(kind === "cloud")   return open + cloud + '</svg>';
  if(kind === "fog")     return open + cloud + '<path d="M11 40h26M15 44h18" stroke="#AAB8C6"></path></svg>';
  if(kind === "drizzle") return open + cloud + '<path d="M18 39l-1 4M26 39l-1 4M34 39l-1 4" stroke="#7FA9D0"></path></svg>';
  if(kind === "rain")    return open + cloud + '<path d="M17 39l-1.6 5M25 39l-1.6 5M33 39l-1.6 5" stroke="#7FA9D0"></path></svg>';
  if(kind === "snow")    return open + cloud + '<path d="M17 41h.02M25 41h.02M33 41h.02M21 45h.02M29 45h.02" stroke="#95B8D8" stroke-width="3.4"></path></svg>';
  if(kind === "storm")   return open + cloud + '<path d="M26 38h-7l5-9" fill="none" stroke="#C98F4F" stroke-width="2.4"></path></svg>';
  return open + cloud + '</svg>';
}

/* ===================== 유틸 ===================== */
function $(id){ return document.getElementById(id); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function readStore(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function writeStore(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }

/* ===================== 시계 ===================== */
var DAYS_KO = ["일","월","화","수","목","금","토"];
function tickClock(){
  var d = new Date();
  $("hm").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("ss").textContent = pad(d.getSeconds());
  $("today").textContent = d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DAYS_KO[d.getDay()] + "요일";

  var h = d.getHours();
  $("greet").textContent =
    h < 5  ? "아직 깊은 밤입니다" :
    h < 11 ? "좋은 아침입니다" :
    h < 14 ? "점심 무렵입니다" :
    h < 18 ? "좋은 오후입니다" :
    h < 22 ? "좋은 저녁입니다" : "하루를 마무리할 시간입니다";

  var start = new Date(d.getFullYear(), 0, 1);
  var week = Math.ceil(((d - start) / 86400000 + start.getDay() + 1) / 7);
  var left = Math.round((new Date(d.getFullYear(), 11, 31) - d) / 86400000);
  $("weekcount").textContent = week + "주차 · 올해 " + left + "일 남음";
}
tickClock();
setInterval(tickClock, 1000);

/* ===================== 검색 ===================== */

function hex2(n){
  n = Math.max(0, Math.min(255, Math.round(n)));
  return (n < 16 ? "0" : "") + n.toString(16);
}
function mix(a, b, t){
  function part(h, i){ return parseInt(h.slice(1 + i * 2, 3 + i * 2), 16); }
  return "#" +
    hex2(part(a,0) + (part(b,0) - part(a,0)) * t) +
    hex2(part(a,1) + (part(b,1) - part(a,1)) * t) +
    hex2(part(a,2) + (part(b,2) - part(a,2)) * t);
}
// 실제 일출·일몰 시각을 눈금으로 삼아 하루의 하늘색 띠를 만든다
function skyRamp(rise, set){
  var noon = (rise + set) / 2;
  return [
    [0,            "#232E44"],   // 한밤
    [rise - 0.075, "#2A364E"],
    [rise - 0.030, "#55617F"],   // 여명
    [rise - 0.005, "#B4918C"],
    [rise + 0.020, "#E5BE95"],   // 일출
    [rise + 0.075, "#B2CDE6"],
    [noon,         "#7FAED9"],   // 한낮
    [set  - 0.075, "#B8CBE2"],
    [set  - 0.020, "#E0A97A"],   // 해질녘
    [set  + 0.005, "#96808F"],
    [set  + 0.050, "#3A4760"],   // 박명
    [1,            "#232E44"]
  ];
}
function sampleRamp(ramp, f){
  if(f <= ramp[0][0]) return ramp[0][1];
  for(var i = 1; i < ramp.length; i++){
    if(f <= ramp[i][0]){
      var span = ramp[i][0] - ramp[i-1][0];
      var t = span <= 0 ? 0 : (f - ramp[i-1][0]) / span;
      return mix(ramp[i-1][1], ramp[i][1], t);
    }
  }
  return ramp[ramp.length - 1][1];
}
function sunTop(f, rise, set){
  if(f <= rise || f >= set) return 76;
  return 66 - Math.sin(((f - rise) / (set - rise)) * Math.PI) * 44;
}
function drawSky(rise, set, now, riseTxt, setTxt){
  var cv = $("skycanvas");
  if(!cv.getContext) return;
  var ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
  var ramp = skyRamp(rise, set);
  for(var x = 0; x < w; x++){
    var c = sampleRamp(ramp, x / w);
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, mix(c, "#FFFFFF", 0.12));
    g.addColorStop(0.6, c);
    g.addColorStop(1, mix(c, "#0B1220", 0.32));
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, 1.05, h);
  }
  var above = now > rise && now < set;
  $("daymarks").innerHTML =
    '<div class="mark edge-l">00시</div>' +
    '<div class="mark" style="left:' + (rise * 100).toFixed(2) + '%">일출 ' + esc(riseTxt) + '</div>' +
    '<div class="mark" style="left:' + (set * 100).toFixed(2) + '%">일몰 ' + esc(setTxt) + '</div>' +
    '<div class="mark edge-r">24시</div>' +
    '<div class="nowdot" style="left:' + (now * 100).toFixed(3) + '%"></div>' +
    '<div class="sun-glyph" style="left:' + (now * 100).toFixed(3) + '%;top:' + sunTop(now, rise, set).toFixed(1) + '%;background:' + (above ? "#FFE9AE" : "#DCE4EE") + '"></div>';
}

function uvBadge(uv){
  var v = Math.round(uv || 0), label, bg, fg;
  if(v <= 2){ label = "낮음"; bg = "#EAF2EC"; fg = "#41775A"; }
  else if(v <= 5){ label = "보통"; bg = "#FAF3EA"; fg = "#9C7440"; }
  else if(v <= 7){ label = "높음"; bg = "#F8EDE5"; fg = "#A66540"; }
  else if(v <= 10){ label = "매우 높음"; bg = "#F8E9EB"; fg = "#A0505C"; }
  else { label = "위험"; bg = "#F1E9F5"; fg = "#75548C"; }
  return v + '<span class="uv-pill" style="background:' + bg + ';color:' + fg + '">' + label + '</span>';
}
function windDir(deg){
  return ["북","북동","동","남동","남","남서","서","북서"][Math.round(deg / 45) % 8];
}
function hhmm(iso){ return iso.slice(11, 16); }
function fracOfDay(iso){
  return (parseInt(iso.slice(11, 13), 10) * 60 + parseInt(iso.slice(14, 16), 10)) / 1440;
}

function drawHourly(times, temps, pops, startIdx){
  // 좁은 화면에서는 시간 수를 줄이고 폭을 화면에 맞춘다 (옆으로 밀지 않아도 되도록)
  var narrow = window.innerWidth < 640;
  var hours = narrow ? 8 : 12;
  var W = narrow ? 340 : 640, minW = narrow ? 0 : 560;
  var H = 128, padL = 16, padR = 16, padT = 26, padB = 34;
  var pts = [];
  for(var i = 0; i < hours; i++){
    var k = startIdx + i;
    if(k >= times.length) break;
    pts.push({t: times[k], v: temps[k], p: pops ? pops[k] : 0});
  }
  if(!pts.length){ $("hourly").innerHTML = ""; return; }
  $("hourlyLabel").textContent = "시간별 · 앞으로 " + pts.length + "시간";

  var vals = pts.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if(mx - mn < 2) mx = mn + 2;
  var step = (W - padL - padR) / (pts.length - 1 || 1);
  function X(i){ return padL + i * step; }
  function Y(v){ return padT + (1 - (v - mn) / (mx - mn)) * (H - padT - padB); }

  var line = "", dots = "", labels = "", bars = "";
  for(var j = 0; j < pts.length; j++){
    var x = X(j), y = Y(pts[j].v), first = j === 0;
    line += (j ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (first ? 3.4 : 2.2) + '" fill="' + (first ? "#C98F4F" : "#FFFFFF") + '" stroke="#C98F4F" stroke-width="1.5"></circle>';
    labels += '<text x="' + x.toFixed(1) + '" y="' + (y - 9).toFixed(1) + '" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="500" fill="#3A434C">' + Math.round(pts[j].v) + '</text>';
    labels += '<text x="' + x.toFixed(1) + '" y="' + (H - 11) + '" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="' + (first ? "#C98F4F" : "#A6AEB8") + '">' + (first ? "지금" : pad(parseInt(pts[j].t.slice(11, 13), 10))) + '</text>';

    var pp = pts[j].p || 0;
    if(pp > 0){
      var bh = Math.max(1.5, (pp / 100) * 15);
      bars += '<rect x="' + (x - 4).toFixed(1) + '" y="' + (H - 25 - bh).toFixed(1) + '" width="8" height="' + bh.toFixed(1) + '" rx="3" fill="#DEE9F3"></rect>';
      if(pp >= 30){
        labels += '<text x="' + x.toFixed(1) + '" y="' + (H - 27 - bh).toFixed(1) + '" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5B87B8">' + pp + '</text>';
      }
    }
  }
  var area = line + " L" + X(pts.length - 1).toFixed(1) + " " + (H - padB) + " L" + X(0).toFixed(1) + " " + (H - padB) + " Z";

  $("hourly").innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" style="min-width:' + minW + 'px" role="img" aria-label="앞으로 ' + hours + '시간 기온과 강수확률">' +
      '<defs><linearGradient id="hourGrad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#C98F4F" stop-opacity=".14"></stop>' +
        '<stop offset="100%" stop-color="#C98F4F" stop-opacity="0"></stop>' +
      '</linearGradient></defs>' +
      '<line x1="0" y1="' + (H - 25) + '" x2="' + W + '" y2="' + (H - 25) + '" stroke="#F4F6F8" stroke-width="1"></line>' +
      bars +
      '<path d="' + area + '" fill="url(#hourGrad)"></path>' +
      '<path d="' + line + '" fill="none" stroke="#C98F4F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path>' +
      dots + labels +
    '</svg>';
}

function drawDays(daily){
  var n = Math.min(6, daily.time.length);
  var los = daily.temperature_2m_min.slice(0, n), his = daily.temperature_2m_max.slice(0, n);
  var gMin = Math.min.apply(null, los), gMax = Math.max.apply(null, his);
  var span = (gMax - gMin) || 1;
  var html = "";
  for(var i = 0; i < n; i++){
    var d = new Date(daily.time[i] + "T00:00:00");
    var name = i === 0 ? "오늘" : (i === 1 ? "내일" : (d.getMonth() + 1) + "/" + d.getDate() + " " + DAYS_KO[d.getDay()]);
    var left = ((los[i] - gMin) / span) * 100;
    var width = Math.max(4, ((his[i] - los[i]) / span) * 100);
    var pop = daily.precipitation_probability_max ? (daily.precipitation_probability_max[i] || 0) : 0;
    html +=
      '<div class="day">' +
        '<span class="dname' + (i === 0 ? " today" : "") + '">' + esc(name) + '</span>' +
        '<span style="color:var(--sun);line-height:0" title="' + esc(wmoText(daily.weather_code[i])) + '">' + icon(wmoKind(daily.weather_code[i]), 20) + '</span>' +
        '<span class="dpop">' + (pop > 0 ? pop + "%" : "") + '</span>' +
        '<span class="range"><i style="left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%"></i></span>' +
        '<span class="dhi">' + Math.round(los[i]) + "/" + Math.round(his[i]) + '</span>' +
      '</div>';
  }
  $("days").innerHTML = html;
}

var lastWx = null;
function loadWeather(){
  var c = CITIES[cityIdx];
  var url = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + c.lat + "&longitude=" + c.lon +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,precipitation" +
    "&hourly=temperature_2m,precipitation_probability" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max" +
    "&timezone=Asia%2FSeoul&forecast_days=7";

  fetch(url).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(d){
    var cur = d.current, day = d.daily;

    $("temp").textContent = Math.round(cur.temperature_2m);
    $("wxIcon").innerHTML = icon(wmoKind(cur.weather_code), 46);
    $("wxDesc").textContent = wmoText(cur.weather_code);
    $("wxFeels").textContent = "체감 " + Math.round(cur.apparent_temperature) + "° · 오늘 " +
      Math.round(day.temperature_2m_min[0]) + "° / " + Math.round(day.temperature_2m_max[0]) + "°";
    $("gHum").innerHTML = cur.relative_humidity_2m + '<small>%</small>';
    $("gWind").innerHTML = windDir(cur.wind_direction_10m) + " " + (cur.wind_speed_10m / 3.6).toFixed(1) + '<small>m/s</small>';
    $("gRain").innerHTML = cur.precipitation.toFixed(1) + '<small>mm</small>';
    $("gUv").innerHTML = uvBadge(day.uv_index_max[0]);
    document.title = Math.round(cur.temperature_2m) + "° " + c.name + " · 아침 정거장";

    var nowHour = cur.time.slice(0, 13), start = 0;
    for(var i = 0; i < d.hourly.time.length; i++){
      if(d.hourly.time[i].slice(0, 13) === nowHour){ start = i; break; }
    }
    lastWx = {times: d.hourly.time, temps: d.hourly.temperature_2m, pops: d.hourly.precipitation_probability, start: start};
    drawHourly(lastWx.times, lastWx.temps, lastWx.pops, lastWx.start);
    drawDays(day);

    var now = new Date();
    drawSky(
      fracOfDay(day.sunrise[0]),
      fracOfDay(day.sunset[0]),
      (now.getHours() * 60 + now.getMinutes()) / 1440,
      hhmm(day.sunrise[0]),
      hhmm(day.sunset[0])
    );
    stampSync();
  }).catch(function(err){
    $("wxDesc").textContent = "날씨를 불러오지 못했습니다";
    $("wxFeels").textContent = "인터넷 연결을 확인한 뒤 페이지를 새로고침해 주세요";
    if(window.console) console.error("weather:", err);
  });
}

// 매체를 바꾸려면 여기만 고치면 됩니다.
// 주의: 기사 주소가 실제로 열리는 매체만 넣을 것.

var FEEDS = {
  eco: [
    {url: "https://www.hankyung.com/feed/economy", source: "한국경제"},
    {url: "https://www.yna.co.kr/rss/economy.xml", source: "연합뉴스"}
  ],
  top: [
    {url: "https://www.yna.co.kr/rss/news.xml",    source: "연합뉴스"}
  ]
};

// 언론사 RSS는 CORS 헤더를 주지 않으므로 공개 중계 서버를 거쳐야 한다.
// 어느 하나가 죽어도 기다리지 않도록, 앞의 것이 3.5초 안에 답하지 않으면
// 다음 것도 동시에 띄워 먼저 도착한 답을 쓴다. 순서는 선호도일 뿐이다.
var PROXIES = [
  function(u){ return {url: "https://api.allorigins.win/raw?url=" + encodeURIComponent(u), mode: "xml"}; },
  function(u){ return {url: "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u), mode: "xml"}; },
  function(u){ return {url: "https://api.allorigins.win/get?url=" + encodeURIComponent(u), mode: "json"}; },
  function(u){ return {url: "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u), mode: "rss2json"}; }
];
var HEDGE_MS = 3500;   // 다음 경로를 함께 띄우기까지 기다리는 시간

function fetchText(url, ms){
  var ctrl = typeof AbortController === "function" ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, ms || 9000) : null;
  var opts = ctrl ? {signal: ctrl.signal} : {};
  return fetch(url, opts).then(function(r){
    if(timer) clearTimeout(timer);
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }, function(e){
    if(timer) clearTimeout(timer);
    throw e;
  });
}

function splitSource(title){
  var source = "";
  var m = title.match(/\s-\s([^-]{2,40})$/);
  if(m) source = m[1].trim();
  return {title: title.replace(/\s-\s[^-]{2,40}$/, "").trim(), source: source};
}

function parseXml(text){
  var doc = new DOMParser().parseFromString(text, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("XML 파싱 실패");
  var nodes = doc.getElementsByTagName("item"), out = [];
  for(var i = 0; i < nodes.length; i++){
    var it = nodes[i];
    function pick(tag){
      var el = it.getElementsByTagName(tag)[0];
      return el ? el.textContent : "";
    }
    var parts = splitSource(pick("title"));
    var source = pick("source") || parts.source;
    var link = pick("link");
    if(parts.title && link) out.push({title: parts.title, link: link, source: source, date: pick("pubDate")});
  }
  if(!out.length) throw new Error("기사가 비어 있음");
  return out;
}

// rss2json은 "2026-09-15 11:11:15" 형태(UTC)로 날짜를 돌려준다
function parseRss2Json(text){
  var data = JSON.parse(text);
  if(data.status !== "ok" || !data.items || !data.items.length) throw new Error("변환 실패");
  var out = [];
  for(var i = 0; i < data.items.length; i++){
    var it = data.items[i];
    if(!it.title || !it.link) continue;
    out.push({
      title: splitSource(it.title).title,
      link: it.link,
      source: "",
      date: it.pubDate ? it.pubDate.replace(" ", "T") + "Z" : ""
    });
  }
  if(!out.length) throw new Error("기사가 비어 있음");
  return out;
}

function parseBy(mode, text){
  if(mode === "rss2json") return parseRss2Json(text);
  if(mode === "json")     return parseXml(JSON.parse(text).contents);
  return parseXml(text);
}

// 경로를 하나씩 "추가로" 띄우고 먼저 성공한 답을 쓴다.
// 앞의 경로가 죽어 있어도 3.5초만 손해 보고 넘어간다.
function loadOne(feedUrl){
  return new Promise(function(resolve, reject){
    var next = 0, failed = 0, settled = false, timer = null;

    function giveUp(){
      failed++;
      if(settled) return;
      if(failed >= PROXIES.length){
        settled = true;
        clearTimeout(timer);
        reject(new Error("모든 경로 실패"));
        return;
      }
      start();   // 빨리 실패했으면 기다리지 말고 바로 다음 경로로
    }

    function start(){
      if(settled || next >= PROXIES.length) return;
      clearTimeout(timer);
      var cfg = PROXIES[next++](feedUrl);

      fetchText(cfg.url, 10000).then(function(text){
        if(settled) return;
        var items = parseBy(cfg.mode, text);   // 실패하면 아래 catch 로 간다
        settled = true;
        clearTimeout(timer);
        resolve(items);
      })["catch"](giveUp);

      if(next < PROXIES.length) timer = setTimeout(start, HEDGE_MS);
    }

    start();
  });
}

// 여러 피드를 동시에 받아, 살아남은 것만 모아 최신순으로 합친다
function loadGroup(feeds){
  var jobs = feeds.map(function(f){
    return loadOne(f.url).then(function(items){
      return items.map(function(it){
        return {title: it.title, link: it.link, date: it.date, source: it.source || f.source};
      });
    }, function(){ return []; });
  });
  return Promise.all(jobs).then(function(lists){
    var merged = [], seen = {};
    for(var i = 0; i < lists.length; i++){
      for(var j = 0; j < lists[i].length; j++){
        var it = lists[i][j], key = it.title.replace(/\s+/g, "");
        if(seen[key]) continue;
        seen[key] = 1;
        merged.push(it);
      }
    }
    if(!merged.length) throw new Error("모든 피드 실패");
    merged.sort(function(a, b){
      return (new Date(b.date).getTime() || 0) - (new Date(a.date).getTime() || 0);
    });
    return merged;
  });
}

function ago(dateStr){
  if(!dateStr) return "";
  var t = new Date(dateStr).getTime();
  if(isNaN(t)) return "";
  var mins = Math.round((Date.now() - t) / 60000);
  if(mins < 1) return "방금";
  if(mins < 60) return mins + "분 전";
  var hrs = Math.round(mins / 60);
  if(hrs < 24) return hrs + "시간 전";
  return Math.round(hrs / 24) + "일 전";
}

function renderFeed(listEl, stampEl, items, count, ranked, stampSuffix){
  var n = Math.min(count, items.length), html = "";
  for(var i = 0; i < n; i++){
    var it = items[i], when = ago(it.date);
    html +=
      '<li' + (ranked && i === 0 ? ' class="lead"' : '') + '>' +
        '<a href="' + esc(it.link) + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="headline">' + (ranked ? '<span class="rank">' + pad(i + 1) + '</span>' : '') + esc(it.title) + '</div>' +
          '<div class="meta">' +
            (it.source ? '<span class="src">' + esc(it.source) + '</span>' : '') +
            (when ? '<span class="when">' + esc(when) + '</span>' : '') +
          '</div>' +
        '</a>' +
      '</li>';
  }
  listEl.innerHTML = html;
  stampEl.textContent = "기사 " + n + "건" + (stampSuffix || "");
}

function failFeed(listEl, stampEl){
  listEl.innerHTML = '<li class="state">뉴스를 불러오지 못했습니다.<br>공개 중계 서버가 잠시 응답하지 않을 수 있어요.<br><button type="button">다시 시도</button></li>';
  listEl.querySelector("button").addEventListener("click", loadNews);
  stampEl.textContent = "연결 실패";
}

// 1순위: 같은 주소에 미리 받아둔 news.json (중계 서버가 필요 없어 늘 빠르고 확실하다)
function loadNews(){
  fetchText("news.json?t=" + Date.now(), 8000).then(function(text){
    var data = JSON.parse(text);
    if(!data || !data.eco || !data.eco.length) throw new Error("비어 있음");
    return data;
  }).then(function(data){
    var stamp = data.updated ? " · " + hhmmLocal(data.updated) + " 기준" : "";
    renderFeed($("ecoFeed"), $("ecoStamp"), data.eco, 10, true, stamp);
    renderFeed($("topFeed"), $("topStamp"), data.top || [], 8, false, stamp);
    stampSync();
  })["catch"](function(){
    loadNewsLive();   // 그래도 안 되면 중계 서버를 거쳐 직접 받아본다
  });
}

function hhmmLocal(iso){
  var d = new Date(iso);
  return isNaN(d.getTime()) ? "" : pad(d.getHours()) + ":" + pad(d.getMinutes());
}

// 2순위: 공개 중계 서버 (news.json 이 없거나 못 읽을 때만)
function loadNewsLive(){
  function attempt(feeds){
    return loadGroup(feeds).then(function(items){ return items; }, function(){ return null; });
  }
  Promise.all([attempt(FEEDS.eco), attempt(FEEDS.top)]).then(function(res){
    var eco = res[0], top = res[1];

    if(eco){
      renderFeed($("ecoFeed"), $("ecoStamp"), eco, 10, true);
      stampSync();
    }else{
      failFeed($("ecoFeed"), $("ecoStamp"));
    }

    if(top){
      // 경제 칸에 이미 올라간 기사는 종합에서 뺀다 (두 칸 모두 연합뉴스를 쓰므로)
      var seen = {};
      if(eco){
        eco.slice(0, 10).forEach(function(it){ seen[it.link] = 1; });
      }
      renderFeed($("topFeed"), $("topStamp"), top.filter(function(it){ return !seen[it.link]; }), 8, false);
    }else{
      failFeed($("topFeed"), $("topStamp"));
    }
  });
}

/* ===================== 갱신 ===================== */
function stampSync(){
  var d = new Date();
  $("lastSync").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
}
loadWeather();
loadNews();
setInterval(loadWeather, 10 * 60 * 1000);
setInterval(loadNews, 15 * 60 * 1000);
document.addEventListener("visibilitychange", function(){
  if(!document.hidden){ loadWeather(); loadNews(); }
});

// 앱으로 설치해 쓸 수 있도록 (https 에서만 동작하고, 실패해도 페이지는 그대로)
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js")["catch"](function(){});
  });
}

// 화면을 돌리거나 창 너비가 바뀌면 그래프를 그 폭에 맞춰 다시 그린다
var resizeTimer = null, lastWidth = window.innerWidth;
window.addEventListener("resize", function(){
  if(window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if(lastWx) drawHourly(lastWx.times, lastWx.temps, lastWx.pops, lastWx.start);
  }, 200);
});
})();
</script>
